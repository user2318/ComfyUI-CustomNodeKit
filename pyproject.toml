[project]
name = "comfyui-customnodekit"
description = "一套为 ComfyUI 设计的自定义节点工具集，涵盖视频生成、姿态处理、图像交互操作等常见工作流需求"
version = "1.0.2"
license = {text = "MIT"}
readme = "README.md"

[tool.comfy]
publisher_id = "user2318"
display_name = "Custom Node Kit"
description = "WanAnimate视频生成、SDPose姿态系统、视频工具、交互式裁剪、上下文窗口调度等节点集合"
nodes = [
    "WanAnimateToVideoCustom",
    "SDPoseDrawKeypointsV2",
    "SDPoseSaveJson",
    "SDPoseLoadJson",
    "SDPoseSliceKeypoints",
    "SDPoseConcatKeypoints",
    "SDPoseEstimateYawSimple",
    "SDPoseEstimateYawAdvanced",
    "SDPoseResizeKeypoints",
    "SDPoseResampleKeypoints",
    "VideoFrameCounter",
    "ImageSequenceToVideo",
    "PathCollectorNode",
    "IndexSelectorNode",
    "PathValidatorNode",
    "FolderImageLoaderNode",
    "ImageBatchConcatNode",
    "ImageBatchResizeNode",
    "InteractiveBatchCrop",
    "WanContextWindowsManual_Custom",
    "ReferenceImageSelector",
    "IntegerSettingNode",
]